kind: standard
category: application
description: Standards for generated Python application code, including project structure, dependency management, and Azure
  SDK patterns.
last_updated: '2026-04-04'
principles:
- id: STAN-PY-001
  description: 'Use Azure SDK with DefaultAzureCredential: Always use DefaultAzureCredential from azure-identity for authenticating
    to Azure services.  This works with managed identity in Azure and developer credentials locally.'
  applies_to:
  - app-developer
  examples:
  - from azure.identity import DefaultAzureCredential
  - credential = DefaultAzureCredential()
  - Never pass connection strings when managed identity is available
  rationale: DefaultAzureCredential provides seamless authentication across local dev and managed identity in production.
- id: STAN-PY-002
  description: 'Project Structure: Python projects must have a clear structure: src/ for application code, tests/ for tests,
    requirements.txt or pyproject.toml for dependencies.  Use packages (directories with __init__.py) for logical grouping.'
  applies_to:
  - app-developer
  examples:
  - src/app/ — application package
  - src/app/main.py — entry point
  - src/app/routes/ — API route handlers
  - src/app/services/ — business logic
  - tests/ — test files
  rationale: Pinned dependencies ensure reproducible builds and prevent unexpected breaking changes.
- id: STAN-PY-003
  description: 'Configuration via Environment Variables: Use environment variables for all configuration (loaded via os.environ
    or a settings class).  Never hardcode service URLs, ports, or feature flags.'
  applies_to:
  - app-developer
  examples:
  - import os; port = int(os.environ.get('PORT', 8080))
  - Use pydantic Settings class for type-safe config
  rationale: Parameterized configurations allow reuse across environments and prevent hardcoded values.
- id: STAN-PY-004
  description: 'Async for I/O-Bound Operations: Use async/await for HTTP handlers, database queries, and external API calls.  Synchronous
    I/O blocks the event loop and reduces throughput.'
  applies_to:
  - app-developer
  examples:
  - 'async def get_items(db: AsyncSession) -> list[Item]:'
  - Use aiohttp or httpx for async HTTP clients
  rationale: Following established standards ensures consistency, quality, and maintainability across the codebase.
- id: STAN-PY-005
  description: 'Type Annotations: Use type annotations on all function signatures and return types. This enables IDE support,
    documentation, and static analysis.'
  applies_to:
  - app-developer
  examples:
  - 'def get_user(user_id: str) -> User | None:'
  - 'async def create_order(order: OrderCreate) -> OrderResponse:'
  rationale: Following established standards ensures consistency, quality, and maintainability across the codebase.
