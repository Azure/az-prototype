kind: standard
domain: principles
description: Universal design principles that all generated code and infrastructure must follow.  These are not suggestions
  — they are standards.
last_updated: '2026-04-04'
principles:
- id: STAN-DES-001
  description: 'Single Responsibility: Every function, method, class, and module must have exactly one responsibility.  If
    a function does more than one thing, split it.'
  applies_to:
  - terraform-agent
  - bicep-agent
  - app-developer
  - csharp-developer
  - python-developer
  - cloud-architect
  examples:
  - 'Terraform: one resource per module when the resource has complex configuration'
  - 'Application: a function that fetches data should not also format it for display'
  - 'Bicep: separate networking resources from compute resources into distinct modules'
  rationale: Modular Bicep templates promote reuse and simplify testing of individual components.
- id: STAN-DES-002
  description: 'DRY (Don''t Repeat Yourself): Extract repeated logic into shared functions, modules, or variables. Duplication
    is acceptable only when the duplicated code serves genuinely different purposes that may evolve independently.'
  applies_to:
  - terraform-agent
  - bicep-agent
  - app-developer
  - csharp-developer
  - python-developer
  examples:
  - 'Terraform: use locals and variables instead of repeating values'
  - 'Application: extract common HTTP client setup into a shared utility'
  - 'Bicep: use modules for repeated resource patterns'
  rationale: Parameterized configurations allow reuse across environments and prevent hardcoded values.
- id: STAN-DES-003
  description: 'Open/Closed Principle: Modules and classes should be open for extension but closed for modification.  Use
    variables, parameters, and composition to allow customization without changing the core implementation.'
  applies_to:
  - terraform-agent
  - bicep-agent
  - app-developer
  - csharp-developer
  - python-developer
  examples:
  - 'Terraform: use variable maps for optional features instead of hard-coded conditionals'
  - 'Application: use dependency injection instead of hard-coded implementations'
  rationale: Parameterized configurations allow reuse across environments and prevent hardcoded values.
- id: STAN-DES-004
  description: 'Least Privilege: Grant only the minimum permissions required.  Every role assignment, network rule, and access
    grant should be as narrow as possible.'
  applies_to:
  - terraform-agent
  - bicep-agent
  - cloud-architect
  - security-reviewer
  examples:
  - Use 'Storage Blob Data Reader' instead of 'Contributor' for read-only access
  - Scope role assignments to the specific resource, not the resource group
  rationale: Following established standards ensures consistency, quality, and maintainability across the codebase.
- id: STAN-DES-005
  description: 'Explicit Over Implicit: Be explicit about configuration, dependencies, and behavior. Avoid relying on defaults
    that may change or on implicit ordering.'
  applies_to:
  - terraform-agent
  - bicep-agent
  - app-developer
  - csharp-developer
  - python-developer
  examples:
  - 'Terraform: always set explicit depends_on when resource ordering matters'
  - 'Bicep: declare parameter defaults explicitly'
  - 'Application: use explicit type annotations and return types'
  rationale: Externalized configuration supports environment-specific settings without code changes.
