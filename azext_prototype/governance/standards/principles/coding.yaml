kind: standard
domain: principles
description: Code quality standards for generated application and infrastructure code.
last_updated: '2026-04-04'
principles:
- id: STAN-CODE-001
  description: 'Meaningful Names: Use descriptive, intention-revealing names for variables, functions, resources, and modules.  Avoid
    abbreviations unless they are universally understood (e.g., HTTP, URL, ID).'
  applies_to:
  - terraform-agent
  - bicep-agent
  - app-developer
  - csharp-developer
  - python-developer
  - react-developer
  examples:
  - Use 'storage_account' not 'sa'; 'container_registry' not 'cr'
  - Use 'get_user_by_email()' not 'get_u()'
  rationale: Parameterized configurations allow reuse across environments and prevent hardcoded values.
- id: STAN-CODE-002
  description: 'Small Functions: Functions should be short and focused.  If a function exceeds roughly 30 lines, it likely
    does too much and should be split.'
  applies_to:
  - app-developer
  - csharp-developer
  - python-developer
  - react-developer
  examples:
  - Split 'process_order()' into 'validate_order()', 'calculate_total()', 'save_order()'
  rationale: The isolated worker model provides better dependency isolation and .NET version flexibility.
- id: STAN-CODE-003
  description: 'Error Handling at Boundaries: Handle errors at system boundaries (user input, external APIs, file I/O).  Internal
    code should trust its contracts.'
  applies_to:
  - app-developer
  - csharp-developer
  - python-developer
  - react-developer
  examples:
  - Validate API request payloads at the controller layer, not in every function
  - Wrap external HTTP calls in try/except, not internal method calls
  rationale: Parameterized configurations allow reuse across environments and prevent hardcoded values.
- id: STAN-CODE-004
  description: 'Consistent Module Structure: Terraform modules should follow a consistent file layout: main.tf, variables.tf,
    outputs.tf, locals.tf, providers.tf. Bicep modules should separate parameters, resources, and outputs.'
  applies_to:
  - terraform-agent
  - bicep-agent
  examples:
  - 'Terraform: variables.tf for inputs, main.tf for resources, outputs.tf for outputs'
  - 'Bicep: param block at top, resource declarations, output block at bottom'
  rationale: Consistent file organization makes code reviewable and prevents merge conflicts across stages.
- id: STAN-CODE-005
  description: 'Parameterize, Don''t Hard-Code: All environment-specific values (names, regions, SKUs, IP ranges) must be
    parameterized via variables or parameters.  Never embed environment-specific values in resource definitions.'
  applies_to:
  - terraform-agent
  - bicep-agent
  - app-developer
  - csharp-developer
  - python-developer
  - react-developer
  examples:
  - 'Terraform: use var.location not ''eastus'' in resource blocks'
  - 'Bicep: use param location string not ''eastus'''
  - 'Application: use environment variables or config files, not inline strings'
  rationale: Parameterized configurations allow reuse across environments and prevent hardcoded values.
