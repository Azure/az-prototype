kind: policy
domain: performance
description: Governance policies for Monitoring Observability
last_updated: '2026-03-27'
rules:
- id: WAF-PERF-OBS-001
  severity: required
  description: Configure Application Insights with auto-instrumentation for .NET, Python, and Node.js — use connection string,
    not instrumentation key
  rationale: Application Insights provides request tracking, dependency tracing, and performance metrics. Connection strings
    support regional ingestion endpoints
  applies_to:
  - terraform-agent
  - bicep-agent
  - cloud-architect
  - app-developer
  - csharp-developer
  - python-developer
  - monitoring-agent
  targets:
  - services:
    - Microsoft.Insights/components
    - Microsoft.OperationalInsights/workspaces
    - Microsoft.Web/sites
    - Microsoft.App/containerApps
    - Microsoft.ContainerService/managedClusters
    - Microsoft.ApiManagement/service
- id: WAF-PERF-OBS-002
  severity: required
  description: Configure custom metric alerts for key performance indicators — P95 latency, error rate, throughput, and resource
    utilization
  rationale: Metric alerts provide proactive notification before performance degradation becomes user-visible; without alerts,
    issues are discovered by users
  applies_to:
  - terraform-agent
  - bicep-agent
  - cloud-architect
  - monitoring-agent
  companion_resources:
  - type: Microsoft.Insights/actionGroups@2023-01-01
    name: ag-ops
    description: Action group for alert notifications — required for metric alerts to trigger email/webhook/Logic App notifications
  targets:
  - services:
    - Microsoft.Insights/components
    - Microsoft.OperationalInsights/workspaces
    - Microsoft.Web/sites
    - Microsoft.App/containerApps
    - Microsoft.ContainerService/managedClusters
    - Microsoft.ApiManagement/service
- id: WAF-PERF-OBS-003
  severity: required
  description: Enable W3C distributed tracing with trace context propagation across all services in the request chain
  rationale: Without distributed tracing, diagnosing performance issues in microservices requires correlating logs across
    multiple systems manually. W3C traceparent header provides automatic correlation
  applies_to:
  - app-developer
  - csharp-developer
  - python-developer
  - cloud-architect
  - monitoring-agent
  targets:
  - services:
    - Microsoft.Insights/components
    - Microsoft.OperationalInsights/workspaces
    - Microsoft.Web/sites
    - Microsoft.App/containerApps
    - Microsoft.ContainerService/managedClusters
    - Microsoft.ApiManagement/service
- id: WAF-PERF-OBS-004
  severity: recommended
  description: Create standard KQL queries for performance monitoring — P95 latency, error rates, throughput, and slow dependency
    calls
  rationale: Pre-built KQL queries enable rapid diagnosis during incidents; without them, engineers spend 15-30 minutes writing
    queries instead of investigating
  applies_to:
  - monitoring-agent
  - cloud-architect
  - qa-engineer
  targets:
  - services:
    - Microsoft.Insights/components
    - Microsoft.OperationalInsights/workspaces
    - Microsoft.Web/sites
    - Microsoft.App/containerApps
    - Microsoft.ContainerService/managedClusters
    - Microsoft.ApiManagement/service
- id: WAF-PERF-OBS-005
  severity: recommended
  description: Configure availability tests for public endpoints — standard URL ping test and multi-step web tests
  rationale: Availability tests detect outages from external perspective (outside Azure network); internal health checks may
    pass while external access fails
  applies_to:
  - terraform-agent
  - bicep-agent
  - cloud-architect
  - monitoring-agent
  targets:
  - services:
    - Microsoft.Insights/components
    - Microsoft.OperationalInsights/workspaces
    - Microsoft.Web/sites
    - Microsoft.App/containerApps
    - Microsoft.ContainerService/managedClusters
    - Microsoft.ApiManagement/service
patterns:
- name: Full observability stack
  description: Application Insights (auto-instrumentation) + metric alerts (P95, errors, CPU) + distributed tracing (W3C)
    + saved KQL queries + availability tests
- name: Three pillars of observability
  description: Metrics (alerts, dashboards), Logs (KQL queries, saved searches), Traces (distributed tracing, service map)
anti_patterns:
- description: Do not deploy applications without Application Insights
  instead: Enable auto-instrumentation via APPLICATIONINSIGHTS_CONNECTION_STRING on all compute resources
- description: Do not use InstrumentationKey for Application Insights configuration
  instead: Use ConnectionString — InstrumentationKey is deprecated and does not support regional ingestion
- description: Do not create alerts without action groups
  instead: Configure action groups with email, webhook, or Logic App receivers for all metric alerts
- description: Do not rely solely on internal health probes
  instead: Add external availability tests from multiple global locations to detect network-level outages
references:
- title: Application Insights overview
  url: https://learn.microsoft.com/azure/azure-monitor/app/app-insights-overview
- title: KQL query language reference
  url: https://learn.microsoft.com/azure/data-explorer/kusto/query/
- title: Metric alerts
  url: https://learn.microsoft.com/azure/azure-monitor/alerts/alerts-metric-overview
- title: Distributed tracing
  url: https://learn.microsoft.com/azure/azure-monitor/app/distributed-trace-data
- title: Availability tests
  url: https://learn.microsoft.com/azure/azure-monitor/app/availability-overview
