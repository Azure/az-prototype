kind: policy
domain: performance
description: Governance policies for Networking Optimization
last_updated: '2026-03-27'
rules:
- id: WAF-PERF-NET-001
  severity: required
  description: Serve static content through CDN or Front Door — configure origin groups, caching, and compression for optimal
    delivery
  rationale: Serving static content from origin adds 50-200ms latency per request; CDN/Front Door reduces this to <10ms from
    edge POPs globally
  applies_to:
  - terraform-agent
  - bicep-agent
  - cloud-architect
  - app-developer
  - csharp-developer
  - python-developer
  targets:
  - services:
    - Microsoft.Network/frontDoors
    - Microsoft.Cdn/profiles
    - Microsoft.Web/sites
    - Microsoft.ApiManagement/service
    - Microsoft.Network/trafficManagerProfiles
    - Microsoft.Compute/virtualMachines
    - Microsoft.Network/loadBalancers
    - Microsoft.Network/virtualNetworks
    - Microsoft.Network/virtualNetworkGateways
    - Microsoft.Network/expressRouteCircuits
- id: WAF-PERF-NET-002
  severity: recommended
  description: Configure connection keep-alive and HTTP/2 for App Service and API Management to reduce connection overhead
  rationale: Each new TCP+TLS connection adds 50-150ms overhead; keep-alive reuses connections and HTTP/2 multiplexes requests
    on a single connection
  applies_to:
  - terraform-agent
  - bicep-agent
  - cloud-architect
  - app-developer
  - csharp-developer
  - python-developer
  targets:
  - services:
    - Microsoft.Network/frontDoors
    - Microsoft.Cdn/profiles
    - Microsoft.Web/sites
    - Microsoft.ApiManagement/service
    - Microsoft.Network/trafficManagerProfiles
    - Microsoft.Compute/virtualMachines
    - Microsoft.Network/loadBalancers
    - Microsoft.Network/virtualNetworks
    - Microsoft.Network/virtualNetworkGateways
    - Microsoft.Network/expressRouteCircuits
- id: WAF-PERF-NET-003
  severity: recommended
  description: Configure multi-region deployment with Traffic Manager or Front Door for latency-sensitive production workloads
  rationale: Single-region deployment adds 50-300ms latency for users in distant regions; multi-region deployment ensures
    <50ms latency globally
  applies_to:
  - terraform-agent
  - bicep-agent
  - cloud-architect
  targets:
  - services:
    - Microsoft.Network/frontDoors
    - Microsoft.Cdn/profiles
    - Microsoft.Web/sites
    - Microsoft.ApiManagement/service
    - Microsoft.Network/trafficManagerProfiles
    - Microsoft.Compute/virtualMachines
    - Microsoft.Network/loadBalancers
    - Microsoft.Network/virtualNetworks
    - Microsoft.Network/virtualNetworkGateways
    - Microsoft.Network/expressRouteCircuits
- id: WAF-PERF-NET-004
  severity: recommended
  description: Enable accelerated networking for production VMs and VMSS to reduce latency and increase throughput
  rationale: Accelerated networking bypasses the host virtual switch, reducing latency by 50% and increasing throughput by
    2-5x. Available on D/E/F/M-series VMs
  applies_to:
  - terraform-agent
  - bicep-agent
  - cloud-architect
  targets:
  - services:
    - Microsoft.Network/frontDoors
    - Microsoft.Cdn/profiles
    - Microsoft.Web/sites
    - Microsoft.ApiManagement/service
    - Microsoft.Network/trafficManagerProfiles
    - Microsoft.Compute/virtualMachines
    - Microsoft.Network/loadBalancers
    - Microsoft.Network/virtualNetworks
    - Microsoft.Network/virtualNetworkGateways
    - Microsoft.Network/expressRouteCircuits
- id: WAF-PERF-NET-005
  severity: recommended
  description: Select ExpressRoute over VPN Gateway for production workloads requiring predictable latency, high throughput,
    or private network connectivity
  rationale: VPN Gateway traffic traverses the public internet with variable latency; ExpressRoute provides dedicated private
    connectivity with guaranteed bandwidth and SLA
  applies_to:
  - cloud-architect
  - cost-analyst
  - terraform-agent
  - bicep-agent
  targets:
  - services:
    - Microsoft.Network/frontDoors
    - Microsoft.Cdn/profiles
    - Microsoft.Web/sites
    - Microsoft.ApiManagement/service
    - Microsoft.Network/trafficManagerProfiles
    - Microsoft.Compute/virtualMachines
    - Microsoft.Network/loadBalancers
    - Microsoft.Network/virtualNetworks
    - Microsoft.Network/virtualNetworkGateways
    - Microsoft.Network/expressRouteCircuits
patterns:
- name: Edge-optimized content delivery
  description: Front Door/CDN for static content + API routing, with separate origin groups for static (Storage) and dynamic
    (App Service) content
- name: Multi-region active-active
  description: Traffic Manager Performance routing with health probes for automatic failover to closest healthy region
anti_patterns:
- description: Do not serve static content from application servers
  instead: Host static content in Storage Account and serve through Front Door/CDN with edge caching
- description: Do not deploy production applications in a single region
  instead: Use multi-region deployment with Traffic Manager or Front Door for latency and availability
- description: Do not use VPN Gateway for latency-sensitive production workloads
  instead: Use ExpressRoute for predictable, low-latency private connectivity
- description: Do not skip accelerated networking for production VMs
  instead: Enable enableAcceleratedNetworking on all D/E/F/M-series VM NICs
references:
- title: Azure Front Door routing
  url: https://learn.microsoft.com/azure/frontdoor/front-door-routing-architecture
- title: Traffic Manager routing methods
  url: https://learn.microsoft.com/azure/traffic-manager/traffic-manager-routing-methods
- title: Accelerated Networking
  url: https://learn.microsoft.com/azure/virtual-network/accelerated-networking-overview
- title: ExpressRoute overview
  url: https://learn.microsoft.com/azure/expressroute/expressroute-introduction
- title: Multi-region web application
  url: https://learn.microsoft.com/azure/architecture/reference-architectures/app-service-web-app/multi-region
