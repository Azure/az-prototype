kind: policy
domain: security
description: Governance policies for Managed Identity
last_updated: '2025-12-01'
rules:
- id: WAF-SEC-MI-001
  severity: required
  description: Use system-assigned managed identity for single-service resources
  rationale: Lifecycle tied to the resource, no orphaned identities
  applies_to:
  - cloud-architect
  - terraform-agent
  - bicep-agent
  - biz-analyst
  template_check:
    scope:
    - container-apps
    - functions
    - app-service
    - api-management
    - container-registry
    require_config:
    - identity
    error_message: Service '{service_name}' ({service_type}) does not configure managed identity
  targets:
  - services:
    - Microsoft.App/containerApps
    - Microsoft.Web/sites
    - Microsoft.KeyVault/vaults
    - Microsoft.Sql/servers/databases
    - Microsoft.DocumentDB/databaseAccounts
    - Microsoft.Storage/storageAccounts
    - Microsoft.ContainerService/managedClusters
    - Microsoft.ContainerRegistry/registries
    - Microsoft.ServiceBus/namespaces
    - Microsoft.EventHub/namespaces
    - Microsoft.Cache/redis
    - Microsoft.CognitiveServices/accounts
    - Microsoft.Search/searchServices
    - Microsoft.DBforPostgreSQL/flexibleServers
    - Microsoft.DBforMySQL/flexibleServers
- id: WAF-SEC-MI-002
  severity: required
  description: Use user-assigned managed identity when identity is shared across resources
  rationale: Avoids role assignment duplication and simplifies rotation
  applies_to:
  - cloud-architect
  - terraform-agent
  - bicep-agent
  targets:
  - services:
    - Microsoft.App/containerApps
    - Microsoft.Web/sites
    - Microsoft.KeyVault/vaults
    - Microsoft.Sql/servers/databases
    - Microsoft.DocumentDB/databaseAccounts
    - Microsoft.Storage/storageAccounts
    - Microsoft.ContainerService/managedClusters
    - Microsoft.ContainerRegistry/registries
    - Microsoft.ServiceBus/namespaces
    - Microsoft.EventHub/namespaces
    - Microsoft.Cache/redis
    - Microsoft.CognitiveServices/accounts
    - Microsoft.Search/searchServices
    - Microsoft.DBforPostgreSQL/flexibleServers
    - Microsoft.DBforMySQL/flexibleServers
- id: WAF-SEC-MI-003
  severity: required
  description: Never use service principal client secrets for service-to-service auth
  rationale: Secrets expire, rotate, and leak; managed identity eliminates this
  applies_to:
  - cloud-architect
  - terraform-agent
  - bicep-agent
  - app-developer
  - csharp-developer
  - python-developer
  - biz-analyst
  targets:
  - services:
    - Microsoft.App/containerApps
    - Microsoft.Web/sites
    - Microsoft.KeyVault/vaults
    - Microsoft.Sql/servers/databases
    - Microsoft.DocumentDB/databaseAccounts
    - Microsoft.Storage/storageAccounts
    - Microsoft.ContainerService/managedClusters
    - Microsoft.ContainerRegistry/registries
    - Microsoft.ServiceBus/namespaces
    - Microsoft.EventHub/namespaces
    - Microsoft.Cache/redis
    - Microsoft.CognitiveServices/accounts
    - Microsoft.Search/searchServices
    - Microsoft.DBforPostgreSQL/flexibleServers
    - Microsoft.DBforMySQL/flexibleServers
- id: WAF-SEC-MI-004
  severity: recommended
  description: Assign least-privilege RBAC roles, never Owner or Contributor at resource group scope
  rationale: Principle of least privilege reduces blast radius
  applies_to:
  - cloud-architect
  - terraform-agent
  - bicep-agent
  - biz-analyst
  targets:
  - services:
    - Microsoft.App/containerApps
    - Microsoft.Web/sites
    - Microsoft.KeyVault/vaults
    - Microsoft.Sql/servers/databases
    - Microsoft.DocumentDB/databaseAccounts
    - Microsoft.Storage/storageAccounts
    - Microsoft.ContainerService/managedClusters
    - Microsoft.ContainerRegistry/registries
    - Microsoft.ServiceBus/namespaces
    - Microsoft.EventHub/namespaces
    - Microsoft.Cache/redis
    - Microsoft.CognitiveServices/accounts
    - Microsoft.Search/searchServices
    - Microsoft.DBforPostgreSQL/flexibleServers
    - Microsoft.DBforMySQL/flexibleServers
patterns:
- name: System-assigned identity with role
  description: Enable system identity and assign a specific role
  example: |
    resource "azapi_resource" "container_app" {
      type      = "Microsoft.App/containerApps@2024-03-01"
      parent_id = azapi_resource.resource_group.id
      name      = "app"
      body = {
        properties = { ... }
        identity = {
          type = "SystemAssigned"
        }
      }
    }
    resource "azapi_resource" "kv_reader" {
      type      = "Microsoft.Authorization/roleAssignments@2022-04-01"
      parent_id = azapi_resource.key_vault.id
      name      = uuidv5("oid", "${azapi_resource.container_app.output.identity.principalId}-Key Vault Secrets User")
      body = {
        properties = {
          principalId      = azapi_resource.container_app.output.identity.principalId
          roleDefinitionId = "/subscriptions/${data.azapi_client_config.current.subscription_id}/providers/Microsoft.Authorization/roleDefinitions/4633458b-17de-408a-b874-0445c86b69e6"
          principalType    = "ServicePrincipal"
        }
      }
    }
anti_patterns:
- description: Do not store client secrets or certificates in application config
  instead: Use managed identity; the Azure SDK handles token acquisition automatically
references:
- title: Managed identities overview
  url: https://learn.microsoft.com/entra/identity/managed-identities-azure-resources/overview
