kind: transform
domain: iac
description: Ensure all azapi_resource blocks have response_export_values
last_updated: '2026-04-06'
transforms:
- id: TFM-TF-002
  description: Add response_export_values = ["*"] to azapi_resource blocks that are missing it
  rationale: The azapi provider requires response_export_values to return any output data.
    Without it, .output is empty and all downstream references fail silently. This is
    the most common generation fabrication — the AI omits it on 25-30% of resources.
  applies_to:
  - terraform-agent
  targets:
  - services: []
  type: structured
  handler: add_response_export_values
  search: azapi_resource without response_export_values
  replace: added response_export_values = ["*"]
