kind: anti-pattern
category: terraform_structure
description: Provider hygiene, version consistency, tag placement, and azapi conventions
last_updated: '2026-04-04'
patterns:
- id: ANTI-TFS-001
  description: Detects Terraform provider blocks in files other than providers.tf
  rationale: Provider blocks outside providers.tf cause confusion about which file controls provider configuration.
  warning_message: azurerm provider declared — use hashicorp/azapi for all Azure resources. The only allowed provider is hashicorp/azapi.
  applies_to:
  - terraform-agent
  targets:
  - services: []
    search_patterns:
    - source  = "hashicorp/azurerm"
    - source = "hashicorp/azurerm"
    - provider "azurerm"
    safe_patterns:
    - '# do not use azurerm'
    - '# never use azurerm'
    - never declare the azurerm
    correct_patterns:
    - source = "hashicorp/azapi"
- id: ANTI-TFS-002
  description: Detects deprecated azurerm provider resources instead of azapi_resource
  rationale: The azurerm provider is not used in this project; all resources use the azapi provider with ARM types.
  warning_message: azurerm resource detected — use azapi_resource with the corresponding ARM resource type instead (e.g.,
    Microsoft.Authorization/roleAssignments@2022-04-01).
  applies_to:
  - terraform-agent
  targets:
  - services: []
    search_patterns:
    - azurerm_role_assignment
    - azurerm_monitor_metric_alert
    - azurerm_storage_management_policy
    - azurerm_key_vault_secret
    - azurerm_monitor_diagnostic_setting
    safe_patterns:
    - '# do not use azurerm'
    - never use azurerm
    correct_patterns:
    - Microsoft.Authorization/roleAssignments@
    - Microsoft.Insights/diagnosticSettings@
- id: ANTI-TFS-003
  description: Detects random provider usage which introduces non-deterministic behavior
  rationale: The random provider introduces non-deterministic behavior that breaks plan reproducibility.
  warning_message: random provider detected — use Terraform built-in functions (e.g., substr(md5("seed"), 0, 8)) instead of
    the random provider.
  applies_to:
  - terraform-agent
  targets:
  - services: []
    search_patterns:
    - source  = "hashicorp/random"
    - source = "hashicorp/random"
    - provider "random"
    - random_string
    - random_id
    - random_pet
    safe_patterns:
    - '# do not use random'
    correct_patterns:
    - substr(md5("
- id: ANTI-TFS-004
  description: Detects data.azurerm_client_config which requires azurerm provider — use variables instead
  rationale: data.azurerm_client_config requires the azurerm provider; use var.subscription_id and var.tenant_id instead.
  warning_message: azapi v1.x version detected — use ~> 2.8.0 or later. v1.x has different tag placement and output access
    semantics that are incompatible with v2.x patterns.
  applies_to:
  - terraform-agent
  targets:
  - services: []
    search_patterns:
    - ~> 1.15
    - ~> 1.14
    - ~> 1.13
    - ~> 1.12
    - ~> 1.11
    - ~> 1.10
    safe_patterns: []
    correct_patterns:
    - ~> 2.8
    - ~> 2.
- id: ANTI-TFS-005
  description: Detects data.azurerm_subscription which requires azurerm provider — use variables instead
  rationale: data.azurerm_subscription requires the azurerm provider; use var.subscription_id instead.
  warning_message: Non-deterministic uuid() detected — use uuidv5() with deterministic seeds (resource ID + principal ID +
    role ID) to ensure idempotent plans.
  applies_to:
  - terraform-agent
  targets:
  - services: []
    search_patterns:
    - uuid()
    safe_patterns:
    - uuidv5
    - '# never use uuid'
    - do not use uuid
    correct_patterns:
    - uuidv5("6ba7b811-9dad-11d1-80b4-00c04fd430c8"
- id: ANTI-TFS-006
  description: Detects versions.tf file which conflicts with the providers.tf convention
  rationale: versions.tf conflicts with the providers.tf convention used in this project's file structure standard.
  warning_message: jsondecode() on azapi_resource output detected — in azapi v2.x, output is already a parsed object. Access
    directly via .output.properties.PropertyName.
  applies_to:
  - terraform-agent
  targets:
  - services: []
    search_patterns:
    - jsondecode(azapi_resource.
    - jsondecode( azapi_resource.
    safe_patterns:
    - '# jsondecode is for v1.x'
    correct_patterns:
    - .output.properties.
- id: ANTI-TFS-007
  description: Detects terraform block in files other than providers.tf
  rationale: terraform {} blocks outside providers.tf cause duplicate block errors and violate the file structure standard.
  warning_message: .output.properties referenced but no response_export_values declaration found in this file. Add response_export_values
    = ["*"] to the azapi_resource whose output properties are being referenced.
  applies_to:
  - terraform-agent
  targets:
  - services: []
    search_patterns:
    - .output.properties.
    safe_patterns:
    - response_export_values
    correct_patterns:
    - response_export_values = ["*"]
