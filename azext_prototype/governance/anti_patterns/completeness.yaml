kind: anti-pattern
category: completeness
description: Structural gaps, incomplete scripts, and missing companion resources
last_updated: "2026-04-04"
patterns:
  - id: ANTI-COMP-001
    description: Detects local auth disabled without a companion managed identity and role assignment
    rationale: Disabling local auth without providing an alternative identity causes authentication failures at runtime.
    warning_message: "Local auth disabled but no managed identity or role assignment detected — include both when disabling local auth."
    applies_to: [terraform-agent, bicep-agent]
    targets:
      - services:
          - Microsoft.Storage/storageAccounts
          - Microsoft.ServiceBus/namespaces
          - Microsoft.EventHub/namespaces
          - Microsoft.CognitiveServices/accounts
          - Microsoft.ContainerRegistry/registries
          - Microsoft.OperationalInsights/workspaces
        search_patterns:
          - "local_authentication_disabled = true"
          - "local_auth_disabled = true"
          - "disableLocalAuth: true"
          - "shared_access_key_enabled = false"
          - "allowSharedKeyAccess: false"
        safe_patterns:
          - "azurerm_user_assigned_identity"
          - "azurerm_role_assignment"
          - "Microsoft.ManagedIdentity/userAssignedIdentities"
          - "roleAssignments"
          - "user_assigned_identity"
        correct_patterns:
          - "Microsoft.ManagedIdentity/userAssignedIdentities"
          - "Microsoft.Authorization/roleAssignments"
          - "# Include managed identity AND role assignment when disabling local auth"

  - id: ANTI-COMP-002
    description: Detects lowercase color variable names in deploy.sh scripts (should be UPPERCASE)
    rationale: Bash convention uses UPPERCASE for constants; lowercase color variables conflict with common variable names.
    warning_message: "Deploy script uses lowercase color variables — use UPPERCASE (YELLOW, RED, GREEN, NC)."
    applies_to: [terraform-agent, bicep-agent]
    targets:
      - services: []
        search_patterns:
          - 'echo -e "${yellow}'
          - 'echo -e "${red}'
          - 'echo -e "${green}'
        safe_patterns:
          - "${NC}"
          - "${YELLOW}"
          - "${RED}"
          - "${GREEN}"
        correct_patterns:
          - 'echo -e "${YELLOW}message${NC}"'
          - 'echo -e "${RED}message${NC}"'
          - 'echo -e "${GREEN}message${NC}"'

  - id: ANTI-COMP-003
    description: Detects azurerm data source lookups that should use terraform_remote_state or input variables
    rationale: azurerm data sources require the azurerm provider which is not used in this project — use remote state or variables instead.
    warning_message: "azurerm data source detected — use terraform_remote_state or input variables to reference prior-stage resources."
    applies_to: [terraform-agent]
    targets:
      - services: []
        search_patterns:
          - 'data "azurerm_resource_group"'
          - 'data "azurerm_log_analytics_workspace"'
          - 'data "azurerm_key_vault"'
          - 'data "azurerm_storage_account"'
          - 'data "azurerm_container_registry"'
        safe_patterns:
          - "terraform_remote_state"
          - "data.terraform_remote_state"
          - "var."
        correct_patterns:
          - "data.terraform_remote_state.stage_name.outputs.resource_id"
          - "var.resource_group_name"
          - "# Reference prior-stage resources via remote state or input variables"

  - id: ANTI-COMP-004
    description: Detects versions.tf file which conflicts with the providers.tf convention
    rationale: This project consolidates terraform {}, required_providers, and backend into providers.tf — a separate versions.tf causes confusion.
    warning_message: "versions.tf detected — consolidate terraform {}, required_providers, and backend into providers.tf only."
    applies_to: [terraform-agent]
    targets:
      - services: []
        search_patterns:
          - "versions.tf"
        safe_patterns:
          - "providers.tf"
        correct_patterns:
          - "providers.tf"
          - "# Consolidate terraform {}, required_providers, and backend into providers.tf only"

  - id: ANTI-COMP-005
    description: Detects variables used in Terraform backend blocks which do not support variable interpolation
    rationale: Terraform backend configuration blocks cannot use variables, locals, or data sources — only literal values are supported.
    warning_message: "Variable reference in backend block — backend blocks only support literal values, not variables."
    applies_to: [terraform-agent]
    targets:
      - services: []
        search_patterns:
          - "var.tfstate_storage_account"
          - "var.backend_storage_account"
          - "var.state_storage_account"
        correct_patterns:
          - 'storage_account_name = "mystorageaccount"'
          - "# Use literal values in backend blocks — variables are not supported"
          - 'backend "local" {}'

  - id: ANTI-COMP-006
    description: Detects empty string values in Terraform backend configuration
    rationale: Empty backend configuration values cause Terraform init failures or silent fallback to defaults.
    warning_message: "Empty backend configuration values detected — provide literal values or use local backend."
    applies_to: [terraform-agent]
    targets:
      - services: []
        search_patterns:
          - 'storage_account_name = ""'
          - 'container_name = ""'
          - 'key = ""'
          - 'resource_group_name = ""'
        safe_patterns:
          - 'backend "local"'
        correct_patterns:
          - 'storage_account_name = "tfstate12345"'
          - 'container_name = "tfstate"'
          - 'key = "stage-name.tfstate"'
          - 'backend "local" {}'

  - id: ANTI-COMP-007
    description: Detects hardcoded resource names using naming convention prefixes instead of variables
    rationale: Hardcoded names with zone prefixes (zd-, pm-, pc-) break when naming conventions change or resources are reused across environments.
    warning_message: "Hardcoded resource name with naming convention prefix detected — use variables or remote state outputs."
    applies_to: [terraform-agent, bicep-agent]
    targets:
      - services: []
        search_patterns:
          - 'queueName = "zd-'
          - 'queueName = "pi-'
          - 'queueName = "pm-'
          - 'queueName = "pc-'
          - 'name = "zdacr'
          - 'name = "zdst'
          - 'resource_group_name = "zd-rg-'
          - 'resource_group_name = "pi-rg-'
          - 'resource_group_name = "pm-rg-'
        safe_patterns:
          - "var."
          - "local."
          - "data.terraform_remote_state"
          - "data.azapi_resource"
        correct_patterns:
          - "data.terraform_remote_state.stage.outputs.queue_name"
          - "var.resource_group_name"
          - "local.resource_group_name"

  - id: ANTI-COMP-008
    description: Detects Storage Blob Delegator role which only grants delegation key access, not blob data access
    rationale: Storage Blob Delegator only grants User Delegation Key access — applications need Storage Blob Data Contributor for actual blob read/write.
    warning_message: "Storage Blob Delegator role detected — use Storage Blob Data Contributor (ba92f5b4) for blob data access."
    applies_to: [terraform-agent, bicep-agent]
    targets:
      - services:
          - Microsoft.Storage/storageAccounts
        search_patterns:
          - "storage blob delegator"
        safe_patterns:
          - "storage blob data contributor"
          - "storage blob data reader"
        correct_patterns:
          - "Storage Blob Data Contributor"
          - "# ba92f5b4-2d11-453d-a403-e96b0029c9fe"

  - id: ANTI-COMP-009
    description: Detects non-existent capacityMode property on Cosmos DB — use capabilities instead
    rationale: The Cosmos DB ARM schema does not have a capacityMode property. Setting it is silently ignored and serverless mode is not activated.
    warning_message: 'capacityMode does not exist in Cosmos DB ARM schema — use capabilities = [{ name = "EnableServerless" }] instead.'
    applies_to: [terraform-agent, bicep-agent]
    targets:
      - services:
          - Microsoft.DocumentDB/databaseAccounts
        search_patterns:
          - 'capacitymode = "serverless"'
          - "capacitymode"
        safe_patterns:
          - "enableserverless"
        correct_patterns:
          - 'capabilities = [{ name = "EnableServerless" }]'

  - id: ANTI-COMP-010
    description: Detects string interpolation for blob service diagnostic settings parent_id instead of a child resource reference
    rationale: String interpolation for ARM child resource IDs is fragile and breaks when the resource ID format changes.
    warning_message: "Use an azapi_resource for blobServices/default and reference its .id for diagnostic settings parent_id."
    applies_to: [terraform-agent]
    targets:
      - services:
          - Microsoft.Storage/storageAccounts
        search_patterns:
          - "/blobservices/default"
        safe_patterns:
          - "azapi_resource"
          - "blob_service"
        correct_patterns:
          - "parent_id = azapi_resource.blob_service.id"
