kind: anti-pattern
category: encryption
description: TLS enforcement, encryption at rest, and transport security detection
last_updated: '2026-04-04'
patterns:
- id: ANTI-ENC-001
  description: Detects TLS version below 1.2 or missing minimum TLS configuration
  rationale: Weak or missing encryption exposes data in transit to interception.
  warning_message: Outdated TLS version detected — enforce minimum TLS 1.2 for all connections.
  applies_to: []
  targets:
  - services: []
    search_patterns:
    - min_tls_version = "1.0"
    - min_tls_version = "1.1"
    - minimum_tls_version = "1.0"
    - minimum_tls_version = "1.1"
    - tls1_0
    - tls1_1
    safe_patterns: []
    correct_patterns:
    - min_tls_version = "1.2"
    - minimum_tls_version = "1.2"
    - minimalTlsVersion = "1.2"
    - minimumTlsVersion = "TLS1_2"
- id: ANTI-ENC-002
  description: Detects HTTP-only endpoints without HTTPS enforcement
  rationale: Following established patterns ensures consistency and reduces deployment failures.
  warning_message: HTTPS enforcement disabled — set https_only = true to redirect all HTTP to HTTPS.
  applies_to: []
  targets:
  - services: []
    search_patterns:
    - https_only = false
    - https_required = false
    safe_patterns: []
    correct_patterns:
    - https_only = true
    - httpsOnly = true
- id: ANTI-ENC-003
  description: Detects disabled encryption at rest using deprecated InstrumentationKey instead of ConnectionString
  rationale: Weak or missing encryption exposes data in transit to interception.
  warning_message: SSL enforcement disabled — enable SSL enforcement with TLS 1.2 minimum.
  applies_to: []
  targets:
  - services: []
    search_patterns:
    - ssl_enforcement_enabled = false
    - ssl_minimal_tls_version_enforced = "tldisabled"
    safe_patterns: []
    correct_patterns:
    - ssl_enforcement_enabled = true
    - sslEnforcement = "Enabled"
    - ssl_minimal_tls_version_enforced = "TLS1_2"
    - minimalTlsVersion = "TLS1_2"
