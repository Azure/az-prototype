kind: anti-pattern
category: bicep_structure
description: Bicep file structure, module conventions, and deployment script patterns
last_updated: '2026-04-04'
patterns:
- id: ANTI-BCS-001
  description: Detects inline resource definitions instead of Bicep module references
  rationale: Consistent file structure and modularization improve maintainability and code review efficiency.
  warning_message: Bicep resources defined inline in main.bicep instead of in modules. Use module references (module <name>
    './modules/<service>.bicep') for all resources.
  applies_to:
  - bicep-agent
  targets:
  - services: []
    search_patterns:
    - 'resource '
    safe_patterns:
    - 'module '
    - modules/
    - existing
    correct_patterns:
    - module identity './modules/identity.bicep'
    - module monitoring './modules/monitoring.bicep'
- id: ANTI-BCS-002
  description: Detects listKeys() or listSas() calls instead of managed identity with RBAC
  rationale: Managed identity with RBAC provides secure, auditable access without credential management.
  warning_message: listKeys() or listSas() detected — use managed identity with RBAC role assignments instead of extracting
    keys or SAS tokens.
  applies_to:
  - bicep-agent
  targets:
  - services: []
    search_patterns:
    - listKeys(
    - listAccountSas(
    - listServiceSas(
    safe_patterns:
    - Microsoft.ManagedIdentity/userAssignedIdentities
    - managedIdentity
    - 'identity: {'
    correct_patterns:
    - Microsoft.ManagedIdentity/userAssignedIdentities
    - 'identity: { type: ''UserAssigned'' }'
- id: ANTI-BCS-003
  description: Detects missing targetScope declaration in subscription-scoped deployments
  rationale: Hardcoded credentials or access keys create security vulnerabilities and prevent key rotation.
  warning_message: Hardcoded resource name detected — use variables with a consistent naming pattern (e.g., var resourceName
    = '${prefix}-${type}-${suffix}').
  applies_to:
  - bicep-agent
  targets:
  - services: []
    search_patterns:
    - 'name: '''
    safe_patterns:
    - 'name: ''${'''
    - 'name: resourceName'
    - 'name: storageAccountName'
    - var resourceName =
    - var storageAccountName =
    correct_patterns:
    - var storageAccountName = '${prefix}-st-${suffix}'
    - 'name: storageAccountName'
- id: ANTI-BCS-004
  description: Detects hardcoded resource names instead of parameterized naming
  rationale: Missing outputs or incomplete configurations cause downstream failures in dependent stages.
  warning_message: Parameter missing @description decorator — all parameters must have @description decorators for documentation
    and discoverability.
  applies_to:
  - bicep-agent
  targets:
  - services: []
    search_patterns:
    - 'param '
    safe_patterns:
    - '@description('
    - '@Description('
    correct_patterns:
    - '@description(''The Azure region for all resources'')'
    - param location string
- id: ANTI-BCS-005
  description: Detects missing @description decorator on Bicep parameters
  rationale: Consistent file structure and modularization improve maintainability and code review efficiency.
  warning_message: Modules referenced but no outputs declared — main.bicep must output all resource IDs, endpoints, and principal
    IDs from module outputs.
  applies_to:
  - bicep-agent
  targets:
  - services: []
    search_patterns:
    - 'module '
    safe_patterns:
    - 'output '
    correct_patterns:
    - output storageAccountId string = storage.outputs.id
    - output identityPrincipalId string = identity.outputs.principalId
- id: ANTI-BCS-006
  description: Detects missing dependsOn for resources that have implicit ordering dependencies
  rationale: Missing outputs or incomplete configurations cause downstream failures in dependent stages.
  warning_message: deploy.sh missing error handling — script must start with set -euo pipefail for safe execution.
  applies_to:
  - bicep-agent
  targets:
  - services: []
    search_patterns:
    - az deployment group create
    safe_patterns:
    - set -euo pipefail
    - set -e
    correct_patterns:
    - set -euo pipefail
    - '#!/bin/bash'
- id: ANTI-BCS-007
  description: Detects missing output declarations for resources consumed by downstream modules
  rationale: Following established patterns ensures consistency and reduces deployment failures.
  warning_message: Outdated API version detected — use API versions from 2023 or later for current resource type definitions
    and feature support.
  applies_to:
  - bicep-agent
  targets:
  - services: []
    search_patterns:
    - '@2021-'
    - '@2020-'
    - '@2019-'
    safe_patterns: []
    correct_patterns:
    - '@2023-'
    - '@2024-'
